server {
    listen 443 ssl;
    server_name ypacileo.42.fr;

    # Allow only TLS 1.2 and TLS 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # WordPress files shared with the PHP-FPM container.
    root /var/www/html;
    index index.php index.html;

    # Serve existing files or forward the request to WordPress.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Forward PHP scripts to PHP-FPM through FastCGI.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
