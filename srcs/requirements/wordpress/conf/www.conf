; Define the PHP-FPM pool named "www".
[www]

; Run the pool worker processes as the Linux user "www-data".
user = www-data

; Run the pool worker processes with the Linux group "www-data".
group = www-data

; Listen for FastCGI connections on port 9000 on every network interface.
listen = 0.0.0.0:9000

; Create and remove worker processes dynamically according to demand.
pm = dynamic

; Allow a maximum of five worker processes at the same time.
pm.max_children = 5

; Start PHP-FPM with two worker processes.
pm.start_servers = 2

; Keep at least one idle worker ready to handle a request.
pm.min_spare_servers = 1

; Keep no more than three idle workers.
pm.max_spare_servers = 3

; Redirect worker output and errors to the main PHP-FPM log.
catch_workers_output = yes
